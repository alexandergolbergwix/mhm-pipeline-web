services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mhm
      POSTGRES_PASSWORD: mhm
      POSTGRES_DB: mhm_pipeline_web
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhm -d mhm_pipeline_web"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
