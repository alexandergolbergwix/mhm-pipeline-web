[project]
name = "mhm-pipeline-web-backend"
version = "0.1.0"
description = "FastAPI backend for the MHM Pipeline web app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "email-validator>=2.2",
    "pymarc>=5.2",
    "rdflib>=7.0",
    "pyshacl>=0.27",
    # Server-side graph layout for the RDF / Knowledge graph view. The
    # browser used to run cose-bilkent over 500 nodes which froze the
    # canvas for seconds; we now ship pre-computed (x, y) positions.
    # scipy unlocks kamada_kawai_layout for nicer force-directed
    # results than spring_layout's default.
    "networkx>=3.0",
    "scipy>=1.10",
    "requests>=2.32",
    "aiosqlite>=0.20",
    "wikibaseintegrator>=0.12",
    # Stage 2 — NER + classifier inference. CPU-only torch is fine; the
    # web tier currently runs the Person model on the HF Hub. Heroku has
    # no GPU so we deliberately don't pin a CUDA build.
    "torch>=2.0,<3",
    "transformers>=4.40",
    "huggingface-hub>=0.20",
    "resend>=2.0",
    "slowapi>=0.1.9",
    "jsonpatch>=1.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC"]
ignore = ["S101", "S106"]  # asserts allowed in tests; bandit's session-binding noise

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
