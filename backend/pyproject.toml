[project]
name = "mhm-pipeline-web-backend"
version = "0.1.0"
description = "FastAPI backend for the MHM Pipeline web app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "email-validator>=2.2",
    "pymarc>=5.2",
    "rdflib>=7.0",
    "pyshacl>=0.27",
    "requests>=2.32",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC"]
ignore = ["S101", "S106"]  # asserts allowed in tests; bandit's session-binding noise

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
